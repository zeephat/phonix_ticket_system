<!DOCTYPE html>
<html lang="sw" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajili Kampuni ya Basi | Phoenix System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome kwa ajili ya Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- NAVBAR / HEADER -->
    <header class="w-full bg-blue-600 dark:bg-blue-800 shadow-md py-4 px-6 relative z-30">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <a href="/" class="text-white font-black text-xl tracking-wider flex items-center space-x-2">
                <i class="fa-solid fa-fire-fluid animate-pulse"></i>
                <span>PHOENIX <span class="text-xs font-light tracking-normal opacity-80">B2B</span></span>
            </a>
            <a href="/" class="text-white hover:text-blue-200 text-xs font-bold bg-white/10 px-4 py-2 rounded-xl transition duration-300">
                <i class="fa-solid fa-arrow-left mr-1"></i> Rudi Nyumbani
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative">
        <!-- BACKGROUND DECORATIONS (Madoido ya Kinyamwezi) -->
        <div class="absolute top-1/4 left-10 w-72 h-72 bg-blue-400/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-10 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- REGISTRATION CARD -->
        <div class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 border border-slate-100 dark:border-slate-700/60 relative z-20 transition-all duration-300">
            
            <!-- HEADER YA CARD -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/50 rounded-2xl flex items-center justify-center text-blue-600 dark:text-blue-400 text-2xl mx-auto mb-4 shadow-sm">
                    <i class="fa-solid fa-bus-simple"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white uppercase">Sajili Kampuni</h1>
                <p class="text-slate-500 dark:text-slate-400 text-xs mt-2 font-medium">Jiunge na Phoenix ili uanze kuuza tiketi kidijitali na kupata ripoti sahihi za mauzo.</p>
            </div>

            <!-- FORM YA USURAJI -->
            <form method="POST" action="" class="space-y-5">
                {% csrf_token %}

                <!-- JINA LA KAMPUNI -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">🏢 JINA LA KAMPUNI</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500 text-sm">
                            <i class="fa-solid fa-building"></i>
                        </span>
                        <input type="text" name="company_name" required placeholder="Mfano: PHOENIX EXPRESS" 
                            class="w-full bg-slate-50 dark:bg-slate-700/50 pl-11 pr-4 py-3 rounded-xl text-xs font-bold text-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 uppercase">
                    </div>
                </div>

                <!-- JINA LA MMILIKI / MTU WA MAWASILIANO -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">👤 JINA LA MMILIKI / MKURUGENZI</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500 text-sm">
                            <i class="fa-solid fa-user-tie"></i>
                        </span>
                        <input type="text" name="owner_name" required placeholder="Mfano: John Doe" 
                            class="w-full bg-slate-50 dark:bg-slate-700/50 pl-11 pr-4 py-3 rounded-xl text-xs font-bold text-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500">
                    </div>
                </div>

                <!-- MAWASILIANO GRID (SIMU NA EMAIL) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- NAMBA YA SIMU -->
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">📞 NAMBA YA SIMU</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500 text-sm">
                                <i class="fa-solid fa-phone"></i>
                            </span>
                            <input type="tel" name="phone" required placeholder="Mfano: 0712345678" 
                                class="w-full bg-slate-50 dark:bg-slate-700/50 pl-11 pr-4 py-3 rounded-xl text-xs font-bold text-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500">
                        </div>
                    </div>
                    
                    <!-- BARUA PEPE (EMAIL) -->
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">✉️ BARUA PEPE (EMAIL)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500 text-sm">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" name="email" required placeholder="info@phoenix.com" 
                                class="w-full bg-slate-50 dark:bg-slate-700/50 pl-11 pr-4 py-3 rounded-xl text-xs font-bold text-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500">
                        </div>
                    </div>
                </div>

                <!-- MAKAO MAKUU -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">📍 MAKAO MAKUU (HEADQUARTERS)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500 text-sm">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </span>
                        <input type="text" name="hq_location" required placeholder="Mfano: DAR ES SALAAM, TANZANIA" 
                            class="w-full bg-slate-50 dark:bg-slate-700/50 pl-11 pr-4 py-3 rounded-xl text-xs font-bold text-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 uppercase">
                    </div>
                </div>

                <!-- BUTTON YA SUBMIT -->
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-black py-3.5 px-4 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/20 cursor-pointer active:scale-[0.98] transition-all duration-150">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Kamilisha Usajili wa Kampuni</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full py-4 text-center text-[10px] font-medium text-slate-400 dark:text-slate-500 border-t border-slate-100 dark:border-slate-800/80 bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm relative z-30">
        &copy; 2026 Phoenix System. Haki zote zimehifadhiwa. Mifumo ya kisasa ya usafirishaji wa abiria.
    </footer>

</body>
</html>
